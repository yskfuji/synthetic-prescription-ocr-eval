# テストとテンプレートの検証だけを行う。AWS の認証は使わない(デプロイは手元から短期の認証で行う)。
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam validate --lint --region ap-southeast-2
        env:
          SAM_CLI_TELEMETRY: "0"

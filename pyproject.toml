[project]
name = "kusuri-eval"
version = "0.1.0"
description = "合成処方箋の読み取り評価基盤(医療機器ではない。診療・調剤の判断に使わない)"
requires-python = ">=3.12"
dependencies = ["pillow>=10", "numpy>=1.26", "openpyxl>=3.1"]

[dependency-groups]
aws = [
    "boto3[crt]>=1.43.117",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kusuri_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
